# Example Courier configuration. Validate with: courier validate -c config.example.yaml
storage:
  endpoint: minio.lan:9000 # MinIO, external to the cluster
  bucket: mirror
  region: us-east-1
  use_ssl: false # LAN only
  path_style: true # required for MinIO
  # ca_file: /etc/courier/ca.crt # for a private CA when use_ssl is true
  access_key_env: S3_ACCESS_KEY # credentials come from the environment (Kubernetes Secret)
  secret_key_env: S3_SECRET_KEY

defaults:
  concurrency: 8
  rate_limit: 50MB/s
  retention:
    grace_period: 72h

repos:
  - name: ubuntu
    type: apt
    upstream: https://archive.ubuntu.com/ubuntu
    prefix: ubuntu
    schedule: "0 */6 * * *"
    # Optional: verify the upstream Release signature before mirroring. Without it the
    # signed files are mirrored unchanged and apt still verifies them on the clients.
    # gpg_keyring: /etc/courier/keys/ubuntu/ubuntu-archive-keyring.gpg
    apt:
      suites: [noble, noble-updates, noble-security]
      components: [main, universe]
      architectures: [amd64]
      # languages: [en]   # i18n Translation-<lang> files to mirror (default: en)
      # contents: false   # also mirror the very large Contents-<arch> indexes (apt-file)

  - name: fedora
    type: rpm
    upstream: https://dl.fedoraproject.org/pub/fedora/linux
    prefix: fedora
    schedule: "30 */6 * * *"
    rpm:
      releases: ["42"]
      repos: [releases, updates]
      architectures: [x86_64]

  - name: alpine
    type: apk
    upstream: https://dl-cdn.alpinelinux.org/alpine
    prefix: alpine
    schedule: "0 */3 * * *"
    apk:
      branches: [v3.20, v3.21]
      repos: [main, community]
      architectures: [x86_64]
      # Optional: verify the upstream APKINDEX signature before mirroring. Without it
      # the index is mirrored unchanged and clients still verify it themselves.
      # keys_dir: /etc/courier/keys/alpine # trusted *.rsa.pub files from https://alpinelinux.org/keys/

server:
  listen: ":8080"

log:
  level: info
  format: json
