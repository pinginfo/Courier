apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "courier.fullname" . }}
  labels:
    {{- include "courier.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate # a single writer; never run two pods syncing at once
  selector:
    matchLabels:
      {{- include "courier.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "courier.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "courier.fullname" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: courier
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve", "-c", "/etc/courier/config.yaml"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: {{ .Values.config.storage.access_key_env }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: {{ .Values.secretKeys.accessKey }}
            - name: {{ .Values.config.storage.secret_key_env }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: {{ .Values.secretKeys.secretKey }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/courier/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- if .Values.caConfigMap }}
            - name: ca
              mountPath: /etc/courier/ca.crt
              subPath: ca.crt
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "courier.fullname" . }}
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
        {{- if .Values.caConfigMap }}
        - name: ca
          configMap:
            name: {{ .Values.caConfigMap }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
