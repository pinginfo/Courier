image:
  repository: courier
  tag: "" # defaults to the chart appVersion; never use "latest"
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Secret holding the S3 credentials. Keys must match the env var names that
# `config.storage.access_key_env` / `secret_key_env` point to.
existingSecret: courier-s3
secretKeys:
  accessKey: S3_ACCESS_KEY
  secretKey: S3_SECRET_KEY

# Rendered verbatim into config.yaml. See config.example.yaml for all options.
config:
  storage:
    endpoint: minio.lan:9000
    bucket: mirror
    region: us-east-1
    use_ssl: false
    path_style: true
    access_key_env: S3_ACCESS_KEY
    secret_key_env: S3_SECRET_KEY
  defaults:
    concurrency: 8
    max_temp_size: 4GB   # cap on temporary disk used by in-flight downloads
    retention:
      grace_period: 72h
  repos: []
  server:
    listen: ":8080"
  log:
    level: info
    format: json

# Trusted signing keys, one ConfigMap per distro, each holding the key files.
# Example (Alpine keys from https://alpinelinux.org/keys/):
#   kubectl create configmap alpine-keys --from-file=keys/alpine/
#   keyMounts:
#     - configMap: alpine-keys
#       path: /etc/courier/keys/alpine   # = repos[].apk.keys_dir
keyMounts: []

# Optional private CA for the MinIO endpoint, mounted at /etc/courier/ca.crt
# (set config.storage.ca_file accordingly).
caConfigMap: ""

replicaCount: 1 # one writer per repo; do not scale out

# Scratch space for in-flight downloads (an emptyDir mounted at /tmp). Courier keeps
# its use under config.defaults.max_temp_size (4GB by default) plus the staged
# repository indexes (a few hundred MB per Fedora or Ubuntu repo). If this limit is
# exceeded, Kubernetes evicts the pod. Keep it comfortably above both.
tmpSize: 10Gi

service:
  type: ClusterIP
  port: 8080
  # For a Prometheus without the Operator, scrape by annotation, for example:
  #   prometheus.io/scrape: "true"
  #   prometheus.io/port: "8080"
  #   prometheus.io/path: "/metrics"
  annotations: {}

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi

# Long enough to let an in-flight sync stop cleanly.
terminationGracePeriodSeconds: 60

nodeSelector: {}
tolerations: []
affinity: {}

serviceMonitor:
  enabled: false
  interval: 30s
  labels: {} # e.g. release: kube-prometheus-stack

prometheusRule:
  enabled: false
  labels: {}
  # Alert when a repo has not synced successfully for this many seconds.
  staleAfterSeconds: 86400


# Grafana dashboard, shipped as a ConfigMap that the Grafana sidecar picks up.
# The same file can be imported by hand: charts/courier/dashboards/courier.json
grafanaDashboard:
  enabled: false
  # Label the Grafana dashboard sidecar watches for (kube-prometheus-stack default).
  labels:
    grafana_dashboard: "1"
  # Put the ConfigMap in another namespace (for example Grafana's), if the
  # sidecar only watches its own namespace. Empty = the release namespace.
  namespace: ""
  # Grafana folder to place the dashboard in (needs the sidecar's folder annotation support).
  folder: ""
