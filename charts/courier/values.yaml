image:
  repository: courier
  tag: "" # defaults to the chart appVersion; never use "latest"
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Secret holding the S3 credentials. Keys must match the env var names that
# `config.storage.access_key_env` / `secret_key_env` point to.
existingSecret: courier-s3
secretKeys:
  accessKey: S3_ACCESS_KEY
  secretKey: S3_SECRET_KEY

# Rendered verbatim into config.yaml. See config.example.yaml for all options.
config:
  storage:
    endpoint: minio.lan:9000
    bucket: mirror
    region: us-east-1
    use_ssl: false
    path_style: true
    access_key_env: S3_ACCESS_KEY
    secret_key_env: S3_SECRET_KEY
  defaults:
    concurrency: 8
    retention:
      grace_period: 72h
  repos: []
  server:
    listen: ":8080"
  log:
    level: info
    format: json

# Trusted signing keys, one ConfigMap per distro, each holding the key files.
# Example (Alpine keys from https://alpinelinux.org/keys/):
#   kubectl create configmap alpine-keys --from-file=keys/alpine/
#   keyMounts:
#     - configMap: alpine-keys
#       path: /etc/courier/keys/alpine   # = repos[].apk.keys_dir
keyMounts: []

# Optional private CA for the MinIO endpoint, mounted at /etc/courier/ca.crt
# (set config.storage.ca_file accordingly).
caConfigMap: ""

replicaCount: 1 # one writer per repo; do not scale out

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi

# Long enough to let an in-flight sync stop cleanly.
terminationGracePeriodSeconds: 60

nodeSelector: {}
tolerations: []
affinity: {}

serviceMonitor:
  enabled: false
  interval: 30s
  labels: {} # e.g. release: kube-prometheus-stack

prometheusRule:
  enabled: false
  labels: {}
  # Alert when a repo has not synced successfully for this many seconds.
  staleAfterSeconds: 86400

